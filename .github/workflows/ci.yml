name: CI

on:
  push:
  pull_request:

jobs:
  pipeline:
    name: pipeline pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pipeline
        working-directory: pipeline
        run: python -m pip install -e .
      - name: Test pipeline
        working-directory: pipeline
        run: pytest

  api:
    name: api pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install API
        working-directory: api
        run: python -m pip install -r requirements.txt
      - name: Test API
        working-directory: api
        run: pytest

  web:
    name: web build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install web
        working-directory: web
        run: npm ci
      - name: Test web
        working-directory: web
        run: npm test
      - name: Build web
        working-directory: web
        run: npm run build

  rules:
    name: firestore rules and store
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          npm install -g firebase-tools
          npm ci --prefix web
          python -m pip install -r api/requirements.txt
      - name: Test Firestore rules
        working-directory: web
        run: npm run test:rules
      - name: Test API store against the emulator
        run: firebase emulators:exec --only firestore --project demo-flamemind "cd api && python -m pytest tests/test_store_emulator.py"
