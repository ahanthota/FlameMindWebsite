# Builds the API image with Cloud Build. Run from the repo root:
#   gcloud builds submit --config api/cloudbuild.yaml --substitutions _IMAGE=<image path> .
steps:
  - name: gcr.io/cloud-builders/docker
    env: ["DOCKER_BUILDKIT=1"]
    args: ["build", "-f", "api/Dockerfile", "-t", "${_IMAGE}", "."]
images: ["${_IMAGE}"]
