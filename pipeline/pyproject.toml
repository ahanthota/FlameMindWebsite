[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "flamemind-pipeline"
version = "0.1.0"
description = "Local PSI extraction pipeline for FlameMind. Runs on laptops, never in production."
requires-python = ">=3.11"
dependencies = [
    "google-genai",
    "pydantic>=2",
    "pypdf",
    "pdfplumber",
    "pandas",
    "numpy",
    "python-dotenv",
    "tqdm",
    "pytest",
    # cryptography 49+ publishes no Intel macOS wheel. pdfplumber pulls it in.
    "cryptography>=43,<49",
]

[tool.setuptools]
py-modules = ["config", "psi_files", "collect_psi", "doi_lookup", "parse", "schema", "extract", "review", "gaps", "insights", "embed", "search"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
